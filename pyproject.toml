[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "session-receipt"
version = "0.1.0"
description = "Local, deterministic, API-equivalent usage receipt for Claude Code and Codex sessions"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.scripts]
session-receipt = "session_receipt.cli:main"

[tool.setuptools]
packages = ["session_receipt"]
